name: Build Manager

on:
  push:
    branches: [ "main", "dev", "ci", "master" ]
    paths:
      - 'README.md'
      - '.github/workflows/build-manager.yml'
      - 'manager/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - 'manager/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manager:
    name: Build Manager APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Write signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -n "$KEYSTORE" ]; then
            {
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
              echo "KEYSTORE_FILE=key.jks"
            } >> gradle.properties
            echo "$KEYSTORE" | base64 -d > key.jks
          else
            # No release keystore configured (forks/PRs): generate a
            # temporary one so the APK is always signed and installable.
            KEYSTORE_PASSWORD=$(openssl rand -hex 32)
            keytool -genkeypair \
              -alias ci-key \
              -keyalg RSA -keysize 2048 \
              -validity 30 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=KoWSU CI Build" \
              -storetype JKS \
              -keystore ci-key.jks
            {
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=ci-key"
              echo "KEY_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEYSTORE_FILE=ci-key.jks"
            } >> gradle.properties
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build with Gradle
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew assembleRelease -PIS_PR_BUILD=true
          else
            ./gradlew assembleRelease
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload mappings
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mappings
          path: manager/app/build/outputs/mapping/release/

      - name: Upload APK to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          SHA=$(git rev-parse --short HEAD)
          TAG="manager-${SHA}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Manager ${SHA}" \
              --generate-notes
          fi
          gh release upload "$TAG" "$APK" --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
